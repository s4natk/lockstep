name = "lockstep"
main = "src/index.ts"
compatibility_date = "2026-10-04"

[[d1_databases]]
binding = "DB"
database_name = "lockstep"
database_id = "00000000-0000-0000-0000-000000000000"

[durable_objects]
bindings = [
  { name = "SESSION", class_name = "ReviewSession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReviewSession"]
