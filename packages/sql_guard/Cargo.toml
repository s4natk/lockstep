[package]
name = "sql_guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "DDL hazard classifier for Lockstep"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.63", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
